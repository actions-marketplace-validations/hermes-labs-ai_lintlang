name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to publish
        required: true
        type: string
      source_run_id:
        description: Release workflow run containing the checked distributions
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}

    steps:
      - name: Check out the published release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install metadata checker
        run: python -m pip install twine

      - name: Retrieve checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify release tag and commit
        run: |
          python scripts/verify_release_tag.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          python scripts/sync-version-docs.py --version "${RELEASE_TAG#v}" --check

      - name: Verify distribution provenance
        run: |
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.path' <<<"$source_run")" = ".github/workflows/release-sync.yml"
          test "$(jq -r '.head_sha' <<<"$source_run")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.head_branch' <<<"$source_run")" = "$RELEASE_TAG"
          test "$(jq -r '.repository.full_name' <<<"$source_run")" = "$GITHUB_REPOSITORY"
          source_event="$(jq -r '.event' <<<"$source_run")"
          test "$source_event" = "push" || test "$source_event" = "workflow_call" || test "$source_event" = "workflow_dispatch"
          source_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest")"
          test "$(jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length' <<<"$source_jobs")" = "1"
          test "$(jq '[.jobs[] | select(.name == "github-release" and .conclusion == "success")] | length' <<<"$source_jobs")" = "1"

      - name: Verify distribution versions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from packaging.utils import canonicalize_name, parse_sdist_filename, parse_wheel_filename

          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one wheel and one sdist")
          wheel_name, wheel_version, _, _ = parse_wheel_filename(wheels[0].name)
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          if canonicalize_name(wheel_name) != "lintlang" or str(wheel_version) != expected_version:
              raise SystemExit("wheel filename does not match the release tag")
          if canonicalize_name(sdist_name) != "lintlang" or str(sdist_version) != expected_version:
              raise SystemExit("sdist filename does not match the release tag")
          PY

      - name: Check package metadata
        run: python -m twine check --strict dist/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Retrieve checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
